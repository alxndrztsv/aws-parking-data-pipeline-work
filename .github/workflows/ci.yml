name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Gitignored files that Terraform reads at validate time:
      # - reference_data/parks.csv            -> filemd5() in s3_upload.tf
      # - lambda_functions/requests_layer.zip -> filebase64sha256() in lambda_ingest_data.tf
      # CI only validates (never deploys), so content-free stubs are enough.
      # The real layer zip is built by the CD workflow; the real parks.csv
      # comes from the PARKS_CSV secret there.
      - name: Create validation stubs for gitignored files
        run: |
          mkdir -p reference_data lambda_functions
          printf 'city_code,park_name\n' > reference_data/parks.csv
          printf 'stub' > lambda_functions/requests_layer.zip

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform init without backend
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform-bootstrap format check
        working-directory: terraform-bootstrap
        run: terraform fmt -check

      - name: Terraform-bootstrap init without backend
        working-directory: terraform-bootstrap
        run: terraform init -backend=false

      - name: Terraform-bootstrap validate
        working-directory: terraform-bootstrap
        run: terraform validate

      - name: Python lint
        run: ruff check .